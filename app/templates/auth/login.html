{% extends "base.html" %}
{% block title %}Log in | DevInsight AI Lite{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <form class="card card-body" method="post" action="/login">
      <h1 class="h4 mb-3">Log in</h1>
      {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control" id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">Log in</button>
      <p class="small text-center mt-3 mb-0">No account yet? <a href="/register">Create one</a></p>
    </form>
  </div>
</div>
{% endblock %}
